<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FORGE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080A">
<title>FORGE — Victor</title>
<style>
:root{
  --bg:#08080A; --surf:#131317; --surf2:#1C1C22; --surf3:#26262E;
  --line:#2C2C35; --txt:#F4F4F6; --dim:#8B8B96; --dim2:#5E5E68;
  --acc:#D8FF3E; --acc-d:#A8C92C; --warn:#FF7A45; --ok:#4ADE80; --bad:#F87171;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);color-scheme:dark}
input[type=date]{-webkit-appearance:none;appearance:none}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.6);cursor:pointer}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;
}
input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
::-webkit-scrollbar{display:none}

/* ---------- typography ---------- */
.h1{font-size:26px;font-weight:800;letter-spacing:-.6px}
.h2{font-size:18px;font-weight:750;letter-spacing:-.3px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim2)}
.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- layout ---------- */
.wrap{padding:0 16px;max-width:620px;margin:0 auto}
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  background:linear-gradient(180deg,var(--bg) 65%,transparent);
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  max-width:620px;margin:0 auto;
}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flat{background:var(--surf);border-color:transparent}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sp{height:8px}.sp16{height:16px}.sp24{height:24px}

/* ---------- nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(10,10,12,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--dim2);transition:color .15s}
nav button.on{color:var(--acc)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav span{font-size:10px;font-weight:700;letter-spacing:.2px}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--acc);color:#0A0A0C;font-weight:800;font-size:16px;
  padding:16px;border-radius:14px;width:100%;letter-spacing:-.2px;
  transition:transform .1s,opacity .15s;
}
.btn:active{transform:scale(.975)}
.btn.ghost{background:var(--surf2);color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:11px 14px;font-size:14px;width:auto;border-radius:11px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #3a1f1f}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:12px;font-weight:650;color:var(--dim)
}
.chip.acc{background:rgba(216,255,62,.12);border-color:rgba(216,255,62,.28);color:var(--acc)}
.chip.warn{background:rgba(255,122,69,.12);border-color:rgba(255,122,69,.3);color:var(--warn)}
.chip.ok{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.25);color:var(--ok)}
.pillbar{display:flex;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.pillbar button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--dim)}
.pillbar button.on{background:var(--surf3);color:var(--txt)}

/* ---------- session card ---------- */
.sesshero{
  position:relative;overflow:hidden;
  background:linear-gradient(145deg,#1A1A20,#101014);
  border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:12px;
}
.sesshero::after{
  content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(216,255,62,.16),transparent 68%);pointer-events:none
}
.tag{
  display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  padding:4px 9px;border-radius:6px;background:var(--acc);color:#0A0A0C
}

/* ---------- paires ---------- */
.pairhead{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--acc);margin:20px 2px 9px}
.pairhead:first-child{margin-top:4px}
.pairhead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(216,255,62,.35),transparent)}
.pairhead.p3{color:var(--dim)}
.pairhead.p3::after{background:linear-gradient(90deg,var(--line),transparent)}
.pairhead.p4{color:var(--dim2)}
.pairhead.p4::after{background:linear-gradient(90deg,var(--line),transparent)}
.pairwrap{border-left:2px solid rgba(216,255,62,.22);padding-left:10px;margin-bottom:4px}

/* ---------- exercise ---------- */
.ex{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ex.done{border-color:rgba(216,255,62,.3)}
.exhead{padding:14px 15px;display:flex;gap:12px;align-items:flex-start}
.exidx{
  flex:0 0 26px;height:26px;border-radius:8px;background:var(--surf3);color:var(--dim);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:1px
}
.ex.done .exidx{background:var(--acc);color:#0A0A0C}
.exname{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.exmeta{font-size:12px;color:var(--dim);margin-top:3px}
.exbody{padding:0 15px 14px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:7px}
.setrow .lbl{font-size:12px;font-weight:800;color:var(--dim2);text-align:center}
.inp{
  background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  padding:11px 8px;text-align:center;font-size:16px;font-weight:700;width:100%;
  font-variant-numeric:tabular-nums;
}
.inp:focus{outline:none;border-color:var(--acc-d);background:var(--surf3)}
.inp::placeholder{color:var(--dim2);font-weight:500}
.tick{
  height:42px;border-radius:10px;background:var(--surf2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--dim2);
}
.tick.on{background:var(--acc);border-color:var(--acc);color:#0A0A0C}
.tick svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12px;color:var(--dim);background:var(--surf2);border-radius:10px;padding:9px 11px;margin-bottom:10px;line-height:1.4}
.hint b{color:var(--txt);font-weight:700}
.cue{font-size:12.5px;color:var(--dim);line-height:1.5;padding:10px 12px;background:rgba(255,255,255,.025);border-left:2px solid var(--surf3);border-radius:0 8px 8px 0}

/* ---------- rest timer ---------- */
#timer{
  position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;
  background:rgba(216,255,62,.97);color:#0A0A0C;border-radius:14px;padding:13px 16px;
  display:none;align-items:center;justify-content:space-between;
  box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:596px;margin:0 auto;
}
#timer.show{display:flex}
#timer .t{font-size:24px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
#timer .lab{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.65}
#timer button{background:rgba(0,0,0,.14);border-radius:9px;padding:8px 12px;font-weight:800;font-size:13px;color:#0A0A0C}

/* ---------- progress / chart ---------- */
.stat{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:13px}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px}
.bar{height:7px;border-radius:4px;background:var(--surf3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px 4px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--dim2);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- collapsible ---------- */
details{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details summary{padding:15px;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"›";font-size:22px;color:var(--dim2);transform:rotate(90deg);transition:transform .2s;line-height:1}
details[open] summary::after{transform:rotate(-90deg)}
details .inner{padding:0 15px 15px}

/* ---------- misc ---------- */
.banner{background:rgba(255,122,69,.1);border:1px solid rgba(255,122,69,.28);color:#FFC5AC;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px;line-height:1.45}
.coach{background:linear-gradient(150deg,rgba(216,255,62,.09),rgba(216,255,62,.02));border:1px solid rgba(216,255,62,.22);border-radius:var(--r);padding:15px;margin-bottom:12px}
.coach .t{font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--acc);margin-bottom:7px}
.coach p{font-size:14px;line-height:1.5;margin-bottom:6px}
.coach p:last-child{margin-bottom:0}
.macro{display:flex;align-items:baseline;gap:6px}
.macro .b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.macro .u{font-size:11px;color:var(--dim);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:0 0 6px}
ul.li{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.li li{display:flex;gap:9px;font-size:13.5px;line-height:1.45;color:var(--dim)}
ul.li li .dot{margin-top:7px}
ul.li li b{color:var(--txt);font-weight:650}
.ol{counter-reset:s;display:flex;flex-direction:column;gap:9px;list-style:none}
.ol li{counter-increment:s;display:flex;gap:10px;font-size:13.5px;line-height:1.45;color:var(--dim)}
.ol li::before{content:counter(s);flex:0 0 20px;height:20px;border-radius:6px;background:var(--surf3);color:var(--dim);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
</style>
</head>
<body>

<div id="app"></div>

<div id="timer">
  <div><div class="lab" id="tlab">Repos</div><div class="t" id="tval">1:30</div></div>
  <div class="row" style="gap:7px">
    <button onclick="addRest(-15)">−15</button>
    <button onclick="addRest(15)">+15</button>
    <button onclick="stopRest()">Skip</button>
  </div>
</div>

<nav id="nav"></nav>

<script>
"use strict";

/* ══════════════════════════════════════════
   1. PROGRAMME
   ══════════════════════════════════════════ */

const PROGRAM = {
  A:{
    key:"A", name:"HAUT A", sub:"Pecs · Dos · Épaules · Bras",
    focus:"Poussée inclinée et tirage vertical appariés. Les deux exercices les plus lourds de ta semaine, faits en moitié moins de temps.",
    ex:[
      {id:"a1",n:"Développé incliné haltères",m:"Haut de pecs",sets:4,lo:6,hi:10,rest:20,blk:"A",pos:1,
       cue:"Banc à 30° max. Ne cherche pas à plaquer les deux omoplates parfaitement à plat : forcer cette position ne fait que te crisper. Descente contrôlée en 2 secondes, remontée explosive. <b>Dès la série finie, tu enchaînes sur le tirage vertical</b> — 20 secondes pour changer de poste, pas plus.",
       alt:"Machine à convergence inclinée."},
      {id:"a2",n:"Tirage vertical prise large",m:"Grand dorsal",sets:4,lo:8,hi:12,rest:65,blk:"A",pos:2,
       cue:"Prise un peu plus large que les épaules, tu tires avec les COUDES vers les hanches. Léger recul du buste, poitrine sortie, barre à la clavicule. <b>Puis 65 s de pause avant de repartir sur le développé.</b> Chaque muscle récupère ainsi 2 minutes pleines entre ses propres séries.",
       alt:"Tractions assistées à la machine."},

      {id:"a3",n:"Landmine press unilatéral",m:"Épaules avant",sets:3,lo:8,hi:12,rest:20,blk:"B",pos:1,uni:true,
       cue:"Une extrémité de barre dans le coin, tu pousses en diagonale vers le haut, un bras à la fois. L'omoplate reste libre de tourner, aucune compression verticale sur la colonne. Les deux bras, puis tu passes au rowing. Commence toujours par le côté faible.",
       alt:"Machine développé épaules à bras indépendants."},
      {id:"a4",n:"Rowing unilatéral, buste appuyé",m:"Milieu du dos",sets:3,lo:8,hi:12,rest:20,blk:"B",pos:2,uni:true,
       cue:"Buste calé sur le support, une main à la fois. Laisse l'omoplate s'étirer complètement vers l'avant, puis tire jusqu'au bas des côtes. Côté faible en premier, et le côté fort ne fait pas une rep de plus. Cette paire ne demande aucune pause supplémentaire : le temps de faire les deux bras suffit à récupérer.",
       alt:"Rowing haltère un bras, main et genou sur le banc."},

      {id:"a5",n:"Élévations latérales haltères",m:"Deltoïde latéral",sets:4,lo:12,hi:20,rest:15,blk:"C",pos:1,
       cue:"L'exercice n°1 de ton objectif : c'est lui qui donne la largeur. Léger, propre, buste très légèrement penché. Monte à l'horizontale, descends en 2 secondes. Si tu balances le corps, c'est trop lourd. Regarde-toi de face : si un bras monte plus haut, baisse la charge.",
       alt:"Élévations à la poulie basse."},
      {id:"a6",n:"Extension triceps poulie haute (corde)",m:"Triceps",sets:3,lo:10,hi:15,rest:30,blk:"C",pos:2,
       cue:"Coudes collés au corps et immobiles, tu écartes la corde en fin de mouvement. Les élévations et les triceps ne se gênent pas : tu peux les alterner sans perdre une seule rep.",
       alt:"Barre droite à la poulie."},

      {id:"a7",n:"Face pull poulie haute",m:"Arrière d'épaules",sets:3,lo:15,hi:20,rest:15,blk:"D",pos:1,
       cue:"Corde à hauteur du visage, tu tires vers le front en écartant, coudes HAUTS, puis tu abaisses activement les omoplates. Meilleur travail de trapèze inférieur disponible. Toujours léger.",
       alt:"Reverse pec-deck."},
      {id:"a8",n:"Curl incliné haltères",m:"Biceps (long chef)",sets:3,lo:10,hi:12,rest:30,blk:"D",pos:2,
       cue:"Banc à 45-60°, bras qui pendent DERRIÈRE le corps : c'est cette position étirée qui fait grossir le biceps en volume. Dernière paire de la séance, tu peux vider le réservoir.",
       alt:"Curl barre EZ."}
    ]
  },
  B:{
    key:"B", name:"HAUT B", sub:"Pecs · Dos · Épaules · Bras",
    focus:"Deuxième dose hebdomadaire sur chaque muscle du haut, angles différents. La fréquence 2x/semaine bat largement 1x.",
    ex:[
      {id:"b1",n:"Développé machine convergente, un bras",m:"Pecs",sets:3,lo:8,hi:12,rest:20,blk:"A",pos:1,uni:true,
       cue:"Assis, dos calé, un bras à la fois : chaque côté charge indépendamment et tu peux enfin comparer honnêtement gauche et droite. Le banc plat est écarté du programme, il fige les appuis et explique tes sensations inégales.",
       alt:"Développé haltère un bras allongé."},
      {id:"b2",n:"Rowing poulie basse prise neutre",m:"Milieu du dos",sets:3,lo:8,hi:12,rest:45,blk:"A",pos:2,
       cue:"Assis, buste quasi vertical, tu tires vers le nombril en gardant le dos droit. Étirement complet en avant sans arrondir le bas du dos. Serre les omoplates 1 seconde.",
       alt:"Machine rowing buste appuyé."},

      {id:"b3",n:"Écarté poulie vis-à-vis (haut vers bas)",m:"Pecs",sets:3,lo:12,hi:15,rest:15,blk:"B",pos:1,
       cue:"Poulies réglées haut, tu ramènes vers le bas du sternum. Coudes légèrement fléchis et FIXES. Une seconde de contraction au centre. C'est l'étirement en position ouverte qui fait le travail.",
       alt:"Pec-deck."},
      {id:"b4",n:"Pull-over poulie haute à genoux",m:"Grand dorsal",sets:3,lo:12,hi:15,rest:45,blk:"B",pos:2,
       cue:"À genoux face à la poulie plutôt que debout penché : bassin stable, bas du dos épargné. Bras quasi tendus, tu abaisses la corde vers les cuisses. Isole le dorsal sans les biceps.",
       alt:"Straight-arm pulldown assis."},

      {id:"b5",n:"Élévations latérales poulie, unilatéral",m:"Deltoïde latéral",sets:4,lo:12,hi:15,rest:15,blk:"C",pos:1,uni:true,
       cue:"Poulie basse, câble devant le corps, tu montes de côté. Tension constante du début à la fin, très supérieure à l'haltère. Côté faible en premier.",
       alt:"Élévations haltères en drop set."},
      {id:"b6",n:"Curl marteau",m:"Brachial / avant-bras",sets:3,lo:12,hi:15,rest:30,blk:"C",pos:2,
       cue:"Le brachial passe SOUS le biceps : le développer pousse le biceps vers le haut et épaissit le bras vu de profil. Prise neutre stricte, pas de rotation, pas de balancier.",
       alt:"Curl à la corde poulie basse."},

      {id:"b7",n:"Face pull poulie haute",m:"Arrière d'épaules",sets:3,lo:15,hi:20,rest:15,blk:"D",pos:1,
       cue:"Deuxième dose de la semaine. Coudes hauts, écartement en fin de course, omoplates qui descendent. Léger.",
       alt:"Oiseau haltères penché."},
      {id:"b8",n:"Extension triceps au-dessus de la tête",m:"Triceps (long chef)",sets:3,lo:12,hi:15,rest:30,blk:"D",pos:2,
       cue:"Bras au-dessus de la tête : cette position étire le long chef du triceps, la portion qui donne le volume au bras vu de dos. Coudes serrés, ne les laisse pas s'écarter.",
       alt:"Extension haltère 2 mains derrière la nuque."}
    ]
  },
  C:{
    key:"C", name:"JAMBES + LARGEUR",
    sub:"Jambes (minimum) · Épaules · Bras",
    focus:"Le strict minimum sur les jambes, apparié à du haut du corps pour ne pas perdre une seconde. Puis on repasse une couche sur la largeur d'épaules.",
    ex:[
      {id:"c1",n:"Presse à cuisses",m:"Quadriceps / fessiers",sets:3,lo:10,hi:15,rest:20,blk:"A",pos:1,
       cue:"Pieds à mi-plateau, largeur d'épaules. Tu peux charger normalement. Seule règle : tu t'arrêtes dès que le bassin s'enroule et que le bas du dos décolle du dossier. Zéro squat barre et zéro soulevé de terre dans ce programme, c'est délibéré.",
       alt:"Squat gobelet haltère."},
      {id:"c2",n:"Tirage vertical prise neutre",m:"Grand dorsal",sets:3,lo:8,hi:12,rest:65,blk:"A",pos:2,
       cue:"Prise serrée en marteau, poignée en V. Angle différent du tirage prise large de la séance A, ça complète le dos par le bas. Coudes vers les hanches.",
       alt:"Tirage vertical prise supination."},

      {id:"c3",n:"Leg curl allongé ou assis",m:"Ischio-jambiers",sets:3,lo:12,hi:15,rest:20,blk:"B",pos:1,
       cue:"Trois séries, non négociables : c'est l'assurance genou et dos la moins chère du monde. Contrôle la phase de retour.",
       alt:"Soulevé de terre roumain haltères, charge légère."},
      {id:"c4",n:"Développé incliné haltères",m:"Haut de pecs",sets:3,lo:8,hi:12,rest:50,blk:"B",pos:2,
       cue:"Troisième dose de pecs de la semaine, sur le haut, la zone qui remplit le t-shirt. Charge un peu plus légère qu'en séance A puisque tu es en fin de semaine.",
       alt:"Machine à convergence inclinée."},

      {id:"c5",n:"Élévations latérales poulie, unilatéral",m:"Deltoïde latéral",sets:4,lo:12,hi:15,rest:15,blk:"C",pos:1,uni:true,
       cue:"Le rappel qui construit ta largeur. Tension constante, côté faible en premier, reps identiques des deux côtés.",
       alt:"Élévations haltères."},
      {id:"c6",n:"Curl poulie basse",m:"Biceps",sets:3,lo:12,hi:15,rest:30,blk:"C",pos:2,

const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const allEx=()=>ORDER.flatMap(k=>PROGRAM[k].ex);
const exById=id=>allEx().find(e=>e.id===id);
function fdate(d){ return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); }
function daysAgo(d){ return Math.round((new Date(today())-new Date(d))/864e5); }

function nextKey(){
  if(!S.logs.length) return "A";
  const last=S.logs[S.logs.length-1].key;
  return ORDER[(ORDER.indexOf(last)+1)%3];
}
function weekNo(){
  if(!S.start) return 1;
  return Math.floor((new Date(today())-new Date(S.start))/(7*864e5))+1;
}
function isDeload(){ const w=weekNo(); return w===7||w===14; }

// dernière perf enregistrée pour un exercice
function lastPerf(exId){
  for(let i=S.logs.length-1;i>=0;i--){
    const s=S.logs[i].sets[exId];
    if(s&&s.length&&s.some(x=>x.w)) return {sets:s.filter(x=>x.w),date:S.logs[i].date};
  }
  return null;
}
function bestOf(exId){
  let b=0,br=0;
  S.logs.forEach(l=>(l.sets[exId]||[]).forEach(s=>{
    const w=parseFloat(s.w)||0; if(w>b){b=w;br=parseInt(s.r)||0;}
  }));
  return b?{w:b,r:br}:null;
}
// conseil de progression : monter le poids ?
function verdict(ex){
  const lp=lastPerf(ex.id);
  if(!lp) return {txt:"Première fois : choisis un poids où tu t'arrêtes à 2 reps de l'échec sur "+ex.lo+"-"+ex.hi+" reps.",cls:""};
  const reps=lp.sets.map(s=>parseInt(s.r)||0);
  const w=lp.sets[0].w;
  if(reps.length>=ex.sets-1 && reps.every(r=>r>=ex.hi))
    return {txt:"Tu as validé "+ex.hi+" reps partout à "+w+" kg → monte à "+(+w+2.5)+" kg cette fois.",cls:"acc"};
  if(reps.some(r=>r<ex.lo))
    return {txt:"Tu es tombé sous "+ex.lo+" reps la dernière fois → garde "+w+" kg et vise "+ex.lo+"+ sur toutes les séries.",cls:"warn"};
  return {txt:"Reste à "+w+" kg et ajoute au moins 1 rep sur une série. C'est ça, progresser.",cls:""};
}

function bwTrend(){
  if(S.bw.length<2) return null;
  const s=[...S.bw].sort((a,b)=>a.d<b.d?-1:1);
  const last=s[s.length-1];
  const ref=s.filter(x=>daysAgo(x.d)>=12);
  if(!ref.length) return {cur:last.kg,delta:null};
  const r=ref[ref.length-1];
  const days=(new Date(last.d)-new Date(r.d))/864e5;
  return {cur:last.kg, delta:+(last.kg-r.kg).toFixed(1), perWk:+(((last.kg-r.kg)/days)*7).toFixed(2)};
}

function coach(){
  const out=[];
  const n=S.logs.length;
  const t=bwTrend();

  if(n===0){
    out.push("On commence par la <b>Séance A — "+PROGRAM.A.name+"</b>. Ton seul objectif aujourd'hui : noter des chiffres, pas soulever lourd. Choisis des poids où tu t'arrêtes à 2 reps de l'échec.");
    out.push("<b>Les exercices vont par paires : tu alternes les deux.</b> Une série du premier, tu changes de poste, une série du second, puis la pause. Le chrono te guide à chaque fois — lis « Séries appariées » dans l'onglet Programme avant de partir.");
    out.push("<b>Les deux premières semaines, ne fais que les paires A, B et C.</b> Tu ajouteras la paire D à partir de la semaine 3. Inutile de tout encaisser d'un coup.");
    out.push("<b>Si un jour tu es pressé, coupe dans l'ordre D → B → C, jamais A.</b> Ce n'est pas l'ordre d'exécution : la paire C contient tes élévations latérales, elle passe avant la paire B en priorité.");
    return out;
  }

  const last=S.logs[S.logs.length-1];
  const gap=daysAgo(last.date);
  if(gap>=8) out.push("<b>"+gap+" jours sans séance.</b> Reprends à ~90 % de tes derniers poids sur la première séance, puis reviens au niveau normal. Ne repars pas de zéro, tu n'as rien perdu.");
  else if(gap>=4) out.push(gap+" jours depuis la dernière séance. Tu es sur 2 séances/semaine plutôt que 3 : c'est encore utile, mais tu progresseras environ 30 % moins vite.");

  if(isDeload()) out.push("<b>Semaine "+weekNo()+" = décharge.</b> Fais les mêmes exercices avec les mêmes poids mais divise le nombre de séries par deux. Ça n'est pas du temps perdu, c'est ce qui te permet de repartir plus fort.");

  if(t&&t.delta!==null){
    if(t.perWk<0.1) out.push("<b>Ton poids ne monte pas ("+(t.delta>=0?"+":"")+t.delta+" kg sur 2 semaines).</b> C'est ton frein n°1, pas l'entraînement. Ajoute 300 kcal par jour : le plus simple, c'est 60 g d'avoine en plus le matin ou une deuxième collation.");
    else if(t.perWk>0.6) out.push("Tu prends "+t.perWk+" kg/semaine, c'est trop rapide — une bonne partie sera du gras. Réduis d'environ 200 kcal par jour.");
    else out.push("Poids corporel : "+t.cur+" kg, "+(t.perWk>0?"+":"")+t.perWk+" kg/semaine. <b>C'est exactement le bon rythme</b>, ne change rien.");
  } else if(S.bw.length<2){
    out.push("Enregistre ton poids dans l'onglet Progrès. Sans ça je ne peux pas te dire si tu manges assez — et à 66 kg pour 1m76, c'est probablement le vrai sujet.");
  }

  // exercice qui stagne
  const stuck=allEx().map(e=>{
    const ws=S.logs.filter(l=>l.sets[e.id]&&l.sets[e.id].some(s=>s.w)).slice(-4)
      .map(l=>Math.max(...l.sets[e.id].map(s=>parseFloat(s.w)||0)));
    return {e,ws};
  }).find(x=>x.ws.length>=4 && Math.max(...x.ws)<=x.ws[0]);
  if(stuck) out.push("<b>"+stuck.e.n+"</b> stagne depuis 4 séances. Deux options : baisse de 10 % et remonte proprement sur 3 séances, ou remplace-le par sa variante ("+stuck.e.alt+").");

  if(out.length===0){
    const k=nextKey();
    out.push("Prochaine séance : <b>"+PROGRAM[k].name+"</b>. "+PROGRAM[k].focus);
  }
  return out;
}

let restLeft=0, restInt=null;
function startRest(s,label){
  restLeft=s; $("timer").classList.add("show");
  if($("tlab")) $("tlab").textContent=label||"Repos";
  paintRest();
  clearInterval(restInt);
  restInt=setInterval(()=>{
    restLeft--; paintRest();
    if(restLeft<=0){ stopRest(); beep(); }
  },1000);
}
function paintRest(){
  const m=Math.floor(Math.max(restLeft,0)/60), s=Math.max(restLeft,0)%60;
  $("tval").textContent=m+":"+String(s).padStart(2,"0");
}
function addRest(d){ restLeft=Math.max(5,restLeft+d); paintRest(); }
function stopRest(){ clearInterval(restInt); $("timer").classList.remove("show"); }
function beep(){
  try{
    if(navigator.vibrate) navigator.vibrate([220,90,220]);
    const c=new (window.AudioContext||window.webkitAudioContext)();
    [0,.22].forEach(t=>{
      const o=c.createOscillator(), g=c.createGain();
      o.frequency.value=880; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(.18,c.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.18);
      o.start(c.currentTime+t); o.stop(c.currentTime+t+.19);
    });
  }catch(e){}
}

          <li><span class="dot"></span><span><b>Mois 3-6 :</b> c'est là que ça devient évident pour les autres. +3 à 5 kg sur la balance, largeur d'épaules nettement supérieure.</span></li>
          <li><span class="dot"></span><span><b>Le vrai risque n'est pas le programme, c'est l'abandon en semaine 5-6</b>, quand la nouveauté est passée et que les résultats ne sont pas encore là. Prépare-toi mentalement à ce creux : il arrive toujours.</span></li>
        </ul>
      </div>
    </details>
    <div class="sp24"></div>
  </div>`;
}

/* ---------- SÉANCE ---------- */
function beginSession(k){
  if(!S.start) S.start=today();
  S.active={key:k,date:today(),sets:{},t0:Date.now()};
  PROGRAM[k].ex.forEach(e=>{
    S.active.sets[e.id]=Array.from({length:e.sets},()=>({w:"",r:"",d:false}));
  });
  save(); tab="session"; render(); window.scrollTo(0,0);
}
function setVal(exId,i,f,v){ S.active.sets[exId][i][f]=v; save(); }
function toggleSet(exId,i){
  const s=S.active.sets[exId][i];
  s.d=!s.d; save();
  if(s.d){ const e=exById(exId); if(e.rest) startRest(e.rest, e.pos===1?"Change de poste":"Pause"); }
  render();
}
function endSession(){
  const a=S.active;
  const any=Object.values(a.sets).flat().some(s=>s.w||s.r);
  if(!any){ if(!confirm("Aucune série enregistrée. Abandonner la séance ?")) return; S.active=null; save(); tab="home"; render(); return; }
  a.dur=Math.round((Date.now()-a.t0)/60000);
  Object.keys(a.sets).forEach(k=>{ a.sets[k]=a.sets[k].filter(s=>s.w||s.r); });
  S.logs.push({date:a.date,key:a.key,sets:a.sets,dur:a.dur});
  S.active=null; save(); stopRest(); tab="stats"; render(); window.scrollTo(0,0);
}

    <div class="sp24"></div><div class="sp24"></div>
  </div>`;
}

/* ---------- PROGRÈS ---------- */
function sparkline(pts,w,h){
  if(pts.length<2) return `<div class="dim" style="font-size:13px;padding:22px 0;text-align:center">Ajoute au moins 2 pesées pour voir la courbe.</div>`;
  const xs=pts.map(p=>new Date(p.d).getTime());
  const ys=pts.map(p=>p.kg);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const y0=Math.min(...ys)-.6,y1=Math.max(...ys)+.6;
  const px=i=>((xs[i]-x0)/(x1-x0||1))*(w-8)+4;
  const py=i=>h-8-((ys[i]-y0)/(y1-y0||1))*(h-20);
  const d=pts.map((p,i)=>(i?"L":"M")+px(i).toFixed(1)+" "+py(i).toFixed(1)).join(" ");
  const area=d+` L ${px(pts.length-1).toFixed(1)} ${h} L ${px(0).toFixed(1)} ${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8FF3E" stop-opacity=".22"/><stop offset="100%" stop-color="#D8FF3E" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#g)"/>
    <path d="${d}" fill="none" stroke="#D8FF3E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(i).toFixed(1)}" r="${i===pts.length-1?4:2.4}" fill="#D8FF3E"/>`).join("")}
  </svg>`;
}

function addBW(){
  const f=$("bwin"), df=$("bwdate");
  const v=parseFloat((f||{}).value);
  const d=((df||{}).value)||today();
  if(!v||v<35||v>200){ if(f){f.style.borderColor="var(--bad)"; f.focus();} return; }
  if(d>today()) return;
  S.bw=S.bw.filter(x=>x.d!==d);
  S.bw.push({d:d,kg:+v.toFixed(1)});
  S.bw.sort((a,b)=>a.d<b.d?-1:1);
  save(); render();
}
function delBW(d){
  if(!confirm("Supprimer la pesée du "+fdate(d)+" ?")) return;
  S.bw=S.bw.filter(x=>x.d!==d); save(); render();
}

      <div class="dim" style="font-size:12.5px;line-height:1.5">
        ${t&&t.delta!==null
          ? `Tendance : <b style="color:${t.perWk>=.15&&t.perWk<=.6?'var(--ok)':'var(--warn)'}">${t.perWk>0?"+":""}${t.perWk} kg/semaine</b>. La cible est entre +0,25 et +0,4. En dessous, tu ne construis pas ; au-dessus, tu prends du gras.`
          : `Pèse-toi le matin à jeun, 3 fois par semaine. C'est l'indicateur le plus important de tout ce programme — plus que n'importe quel chiffre à la salle.`}
      </div>
    </div>

    <div class="grid2">
      <div class="stat"><div class="v num">${S.logs.length}</div><div class="k">Séances totales</div></div>
      <div class="stat"><div class="v num">${S.logs.filter(l=>daysAgo(l.date)<28).length}</div><div class="k">Sur 4 semaines</div></div>
    </div>

    <div class="sp"></div>
    <div class="card">
      <div class="h2" style="margin-bottom:11px">Records</div>
      ${recs.length?`<table>
        <tr><th>Exercice</th><th style="text-align:right">Meilleure série</th></tr>
        ${recs.map(r=>`<tr><td>${r.e.n}</td><td class="n">${r.b.w} kg × ${r.b.r}</td></tr>`).join("")}
      </table>`:`<div class="dim" style="font-size:13px">Rien encore. Fais ta première séance.</div>`}
    </div>

    <div class="card">
      <div class="h2" style="margin-bottom:11px">Historique</div>
      ${last8.length?last8.map(l=>{
        const vol=Object.values(l.sets).flat().reduce((a,s)=>a+((parseFloat(s.w)||0)*(parseInt(s.r)||0)),0);
        const ns=Object.values(l.sets).flat().length;
        return `<div class="between" style="padding:11px 0;border-bottom:1px solid var(--line)">
          <div><div style="font-weight:700;font-size:14px">${PROGRAM[l.key].name}</div>
          <div class="dim" style="font-size:12px">${fdate(l.date)} · ${ns} séries${l.dur?" · "+l.dur+" min":""}</div></div>
          <div class="num" style="font-weight:800;font-size:14px">${Math.round(vol).toLocaleString("fr-FR")} kg</div>
        </div>`}).join(""):`<div class="dim" style="font-size:13px">Aucune séance enregistrée.</div>`}
    </div>

    <div class="sp"></div>
    <div class="row" style="gap:8px">
      <button class="btn ghost sm" style="flex:1" onclick="exportData()">Exporter mes données</button>
      <button class="btn danger sm" style="flex:1" onclick="if(confirm('Tout effacer définitivement ?')){S=blank();save();render()}">Réinitialiser</button>
    </div>
    <div class="sp24"></div>
  </div>`;
}

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="forge-"+today()+".json";
  a.click();
}

/* ---------- NUTRITION ---------- */

  <div class="wrap">
    <div class="card">

      <div class="dim" style="font-size:12.5px;margin-bottom:14px">Estimation pour 1m76 / 66 kg avec 3 séances par semaine, surplus d'environ +350 kcal. À réajuster selon la balance, pas selon la théorie.</div>
      <div class="grid2" style="gap:14px">
        <div><div class="macro"><span class="b">${NUTRI.kcal}</span><span class="u">kcal</span></div><div class="k dim" style="font-size:11px">Énergie</div></div>
        <div><div class="macro"><span class="b" style="color:var(--acc)">${NUTRI.prot}</span><span class="u">g</span></div><div class="k dim" style="font-size:11px">Protéines</div></div>
        <div><div class="macro"><span class="b">${NUTRI.gluc}</span><span class="u">g</span></div><div class="k dim" style="font-size:11px">Glucides</div></div>
        <div><div class="macro"><span class="b">${NUTRI.lip}</span><span class="u">g</span></div><div class="k dim" style="font-size:11px">Lipides</div></div>

    <div class="eyebrow" style="padding:6px 2px 10px">La journée type</div>
    ${NUTRI.day.map(d=>`

          <div style="font-weight:750;font-size:15px">${d.t}</div>
          <span class="chip">${d.k}</span>
        </div>
        <div class="dim" style="font-size:13.5px;line-height:1.5">${d.d}</div>
      </div>`).join("")}

    <div class="sp"></div>
    <div class="eyebrow" style="padding:6px 2px 10px">8 dîners · 30 min max</div>
    ${NUTRI.meals.map(m=>`
      <details>
        <summary><span style="flex:1">${m.n}</span><span class="chip acc" style="flex:0 0 auto">${m.p} g P</span></summary>
        <div class="inner">
          <div class="row" style="gap:6px;margin-bottom:12px"><span class="chip">${m.k} kcal</span><span class="chip">${m.t}</span></div>
          <div class="eyebrow" style="margin-bottom:8px">Ingrédients</div>
          <ul class="li" style="margin-bottom:14px">${m.ing.map(i=>`<li><span class="dot"></span><span>${i}</span></li>`).join("")}</ul>
          <div class="eyebrow" style="margin-bottom:8px">Préparation</div>
          <ol class="ol">${m.st.map(s=>`<li>${s}</li>`).join("")}</ol>
        </div>
      </details>`).join("")}

    <div class="card" style="border-color:rgba(255,122,69,.28);background:rgba(255,122,69,.06)">
      <div class="h2" style="margin-bottom:7px;color:#FFC5AC">Jour de flemme</div>
      <div style="font-size:13.5px;line-height:1.5;color:#FFD9C8">${NUTRI.lazy}</div>
    </div>

    <div class="sp"></div>
    <div class="eyebrow" style="padding:6px 2px 10px">Les règles qui comptent</div>
    <div class="card">
      <ul class="li">${NUTRI.rules.map(r=>`<li><span class="dot"></span><span>${r}</span></li>`).join("")}</ul>
    </div>

    <details>
      <summary>Compléments : ce qui sert vraiment</summary>
      <div class="inner">
        <ul class="li">
          <li><span class="dot"></span><span><b>Créatine monohydrate, 5 g/jour.</b> Le seul complément avec un effet clairement démontré sur la prise de muscle. N'importe quelle marque, à n'importe quel moment de la journée, tous les jours y compris sans entraînement. Environ 20 € pour six mois.</span></li>
          <li><span class="dot"></span><span><b>Whey :</b> utile uniquement si tu n'atteins pas 140 g de protéines avec la nourriture. Ce n'est pas magique, c'est juste de la protéine pratique.</span></li>
          <li><span class="dot"></span><span><b>Vitamine D</b> l'hiver si tu ne vois pas beaucoup le soleil.</span></li>
          <li><span class="dot"></span><span><b>Tout le reste — BCAA, pre-workout, brûleurs, testo boosters :</b> inutile. Garde ton argent pour la nourriture.</span></li>

/* ══════════════════════════════════════════
   8. RENDER
   ══════════════════════════════════════════ */
function render(){
  if(tab==="session" && !S.active) tab="home";
  const v = tab==="session" ? vSession()
          : tab==="prog" ? vProg()
          : tab==="stats" ? vStats()
          : tab==="food" ? vFood()
          : vHome();
  $("app").innerHTML=v;
  navBar();
}
if(S.active) tab="session";
render();
</script>
</body>
</html>
